# Production stack for a single small VPS.
#
#   git clone && cp .env.example .env && docker compose up -d
#
# Deliberately different from docker-compose.dev.yml: durability settings are
# left at their safe defaults here, no port is published except Caddy's, and the
# API image is built rather than run from source.
#
# Sizing note: the OSRM extract must be region-clipped. A whole-Greece extract
# serves at ~1.15 GB RSS against ~39 MB for an Evros+30km clip, which is the
# difference between fitting a 2 GB VPS and not. See RISKS.md risk 3.

name: carpool

services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://carpool:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/carpool?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OSRM_URL: http://osrm:5000
      HTTP_ADDR: ":8080"
      REGION_FIXTURE: ${REGION_FIXTURE:-/fixtures/regions/greece.geojson}
      FUEL_PRICE_EUR: ${FUEL_PRICE_EUR:-1.800}
      OSRM_DATA_VERSION: ${OSRM_DATA_VERSION:-unknown}
      # Route links. Empty means a share is the sentence alone.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      INSTALL_URL: ${INSTALL_URL:-}
      # Must stay false: DEV_MODE prints OTP codes instead of sending them.
      DEV_MODE: "false"
    expose:
      - "8080"

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: carpool
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tuned for a 2 GB box. Durability settings are left alone here; only the
    # dev stack trades them away.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool -d carpool"]
      interval: 10s
      timeout: 5s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld --port 5000 /data/${OSRM_EXTRACT:-evros-buffered}.osrm
    volumes:
      - ./osrm-data:/data:ro
    healthcheck:
      # The image ships neither wget nor curl, but it does have bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
