# Builds the API image and hands it to the VM. The VM never builds anything:
# a Go build does not fit in its 1 GB.
name: deploy-api

on:
  push:
    branches: [master]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "fixtures/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      # The image carries the Expo web build, served under /app.
      - "app/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing the older one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The integration tests are what catch a privacy or concurrency regression;
    # vet and build alone do not. Without CARPOOL_TEST_DSN they skip themselves,
    # so the database has to be here for this gate to mean anything.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carpool
          POSTGRES_PASSWORD: carpool
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U carpool" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARPOOL_TEST_DSN: postgres://carpool:carpool@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet, test and build
        run: |
          go vet ./...
          go test -timeout 20m ./...
          go build ./...

      # The image ships the web build, so the app's own gate runs here too.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Typecheck and test the app
        working-directory: app
        run: |
          npm ci --legacy-peer-deps
          npm run check

      - name: Build image
        run: docker build -t "carpool-api:${GITHUB_SHA}" .

      - name: Ship to the VM
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "carpool-api:${GITHUB_SHA}" | gzip |
            ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@${HOST}" "api ${GITHUB_SHA}"

      - name: Smoke test through the public hostname
        run: |
          curl -fsS -m 10 --retry 5 --retry-delay 3 --retry-all-errors https://carpool.haroldpoi.dev/v1/readyz
          curl -fsS -m 10 --retry 3 --retry-delay 3 -o /dev/null https://carpool.haroldpoi.dev/
          curl -fsS -m 10 --retry 3 --retry-delay 3 https://carpool.haroldpoi.dev/app/ | grep -q 'id="root"'
