plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'gr.carpool'
version = '1.0.0'

android {
  namespace "gr.carpool.drivedetect"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The same version expo-location already brings, so the app carries one.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation "androidx.core:core:1.17.0"
}
